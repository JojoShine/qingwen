services:
  app:
    image: ${QINGWEN_IMAGE:-ghcr.io/jojoshine/qingwen:latest}
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3218}:3000"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.docker 中配置数据库密码}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请配置至少8位的管理员密码}
      ADMIN_NAME: ${ADMIN_NAME:-管理员}
      APP_URL: ${APP_URL:-}
      DEMO_USERNAME: ${DEMO_USERNAME:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}
    volumes:
      - qingwen_data:/var/lib/postgresql/data

volumes:
  qingwen_data:
