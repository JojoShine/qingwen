services:
  migrate:
    image: ${QINGWEN_IMAGE:-docker.io/jojoshine/qingwen:latest}
    command: ["pnpm", "db:migrate"]
    restart: "no"
    healthcheck:
      disable: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:?请配置现有 PostgreSQL 的 DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-管理员}

  app:
    image: ${QINGWEN_IMAGE:-docker.io/jojoshine/qingwen:latest}
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3218}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?请配置现有 PostgreSQL 的 DATABASE_URL}
      APP_URL: ${APP_URL:-}
      DEMO_USERNAME: ${DEMO_USERNAME:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
