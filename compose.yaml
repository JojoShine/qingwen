services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_DB: survey
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-survey_local_dev}
    volumes:
      - survey_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d survey"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  survey_pgdata:
