name: CI and container images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: survey
          POSTGRES_USER: survey
          POSTGRES_PASSWORD: qingwen_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U survey -d survey"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://survey:qingwen_ci_only@127.0.0.1:5432/survey?schema=public
      ADMIN_USERNAME: ci_admin
      ADMIN_PASSWORD: CiOnly!12345678
      ADMIN_NAME: CI
      DEMO_USERNAME: ci_demo
      DEMO_PASSWORD: CiDemoOnly!12345678
      APP_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize test database
        run: |
          pnpm db:generate
          pnpm db:migrate
          pnpm db:seed
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start production server
        run: |
          pnpm start > /tmp/qingwen-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3218/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qingwen-server.log
          exit 1
      - name: Unit and API integration tests
        run: RUN_INTEGRATION=1 pnpm test
      - name: Browser tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            test-results/
            playwright-report/
            /tmp/qingwen-server.log
          retention-days: 7

  publish:
    name: Publish ${{ matrix.image }} (${{ matrix.variant }})
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: qingwen
            target: runner
            variant: root
            base_path: ""
          - image: qingwen
            target: runner
            variant: surveys
            base_path: /surveys
          - image: qingwen-migrate
            target: migrator
            variant: root
            base_path: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub configuration
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub publication is disabled. Configure DOCKERHUB_USERNAME (variable) and DOCKERHUB_TOKEN (secret) to enable it. GHCR publication remains enabled."
          fi
      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          VARIANT: ${{ matrix.variant }}
          HUB_ENABLED: ${{ steps.hub.outputs.enabled }}
          HUB_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          image_suffix=""
          if [ "$VARIANT" = surveys ]; then
            image_suffix="-surveys"
          fi
          {
            echo 'tags<<IMAGE_TAGS'
            echo "ghcr.io/${OWNER,,}/${IMAGE}:latest${image_suffix}"
            echo "ghcr.io/${OWNER,,}/${IMAGE}:sha-${GITHUB_SHA}${image_suffix}"
            if [ "$HUB_ENABLED" = true ]; then
              echo "docker.io/${HUB_NAMESPACE}/${IMAGE}:latest${image_suffix}"
              echo "docker.io/${HUB_NAMESPACE}/${IMAGE}:sha-${GITHUB_SHA}${image_suffix}"
            fi
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: NEXT_PUBLIC_BASE_PATH=${{ matrix.base_path }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.variant }}
