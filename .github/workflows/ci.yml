name: CI and container images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: survey
          POSTGRES_USER: survey
          POSTGRES_PASSWORD: qingwen_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U survey -d survey"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://survey:qingwen_ci_only@127.0.0.1:5432/survey?schema=public
      ADMIN_USERNAME: ci_admin
      ADMIN_PASSWORD: CiOnly!12345678
      ADMIN_NAME: CI
      DEMO_USERNAME: ci_demo
      DEMO_PASSWORD: CiDemoOnly!12345678
      APP_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize test database
        run: |
          pnpm db:generate
          pnpm db:migrate
          pnpm db:seed
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start production server
        run: |
          pnpm start > /tmp/qingwen-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3218/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qingwen-server.log
          exit 1
      - name: Unit and API integration tests
        run: RUN_INTEGRATION=1 pnpm test
      - name: Browser tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            test-results/
            playwright-report/
            /tmp/qingwen-server.log
          retention-days: 7

  publish:
    name: Verify and publish qingwen (${{ matrix.variant }})
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: root
            base_path: ""
          - variant: surveys
            base_path: /surveys
    env:
      QINGWEN_IMAGE: qingwen-ci:${{ github.sha }}-${{ matrix.variant }}
      POSTGRES_PASSWORD: ImageDatabaseOnly123
      ADMIN_USERNAME: ci_image_admin
      ADMIN_PASSWORD: ImageOnly!12345678
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Docker Hub publication requires DOCKERHUB_USERNAME (variable) and DOCKERHUB_TOKEN (secret)."
            exit 1
          fi
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: qingwen
          VARIANT: ${{ matrix.variant }}
          HUB_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          image_suffix=""
          if [ "$VARIANT" = surveys ]; then
            image_suffix="-surveys"
          fi
          {
            echo 'tags<<IMAGE_TAGS'
            echo "ghcr.io/${OWNER,,}/${IMAGE}:latest${image_suffix}"
            echo "ghcr.io/${OWNER,,}/${IMAGE}:sha-${GITHUB_SHA}${image_suffix}"
            echo "docker.io/${HUB_NAMESPACE}/${IMAGE}:latest${image_suffix}"
            echo "docker.io/${HUB_NAMESPACE}/${IMAGE}:sha-${GITHUB_SHA}${image_suffix}"
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"
      - name: Build unified image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          load: true
          build-args: NEXT_PUBLIC_BASE_PATH=${{ matrix.base_path }}
          tags: ${{ env.QINGWEN_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runner-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.variant }}
      - name: Verify embedded database, persistence and backup recovery
        run: |
          cat > /tmp/qingwen-image-check.cjs <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const base = 'http://127.0.0.1:3000' + process.env.NEXT_PUBLIC_BASE_PATH;
            assert((await fetch(base + '/login')).ok, 'Login page must load');
            const origin = 'http://127.0.0.1:3000';
            const response = await fetch(base + '/api/auth/login', {
              method: 'POST', headers: { 'Content-Type': 'application/json', Origin: origin },
              body: JSON.stringify({ username: 'ci_image_admin', password: 'ImageOnly!12345678' }),
            });
            assert(response.ok, 'Original administrator password must still work');
            const cookie = response.headers.getSetCookie().map(value => value.split(';')[0]).join('; ');
            assert(cookie, 'Login must issue a session');
            const headers = { Cookie: cookie, Origin: origin, 'Content-Type': 'application/json' };
            const title = 'Container persistence verification';
            if (process.env.CHECK_CREATE === '1') {
              const created = await fetch(base + '/api/surveys', { method: 'POST', headers, body: JSON.stringify({ title }) });
              assert(created.ok, 'Survey must be created in embedded PostgreSQL');
              const survey = await created.json();
              const id = crypto.randomUUID();
              const question = { id, type: 'attachment', title: 'CI attachment', description: '', required: true, options: [], rows: [], other: false, placeholder: '', maxLength: 500, fileMode: 'all', maxFiles: 1, maxFileSizeMB: 10 };
              assert((await fetch(base + '/api/surveys/' + survey.id, { method: 'PATCH', headers, body: JSON.stringify({ content: [question] }) })).ok);
              assert((await fetch(base + '/api/surveys/' + survey.id + '/action', { method: 'POST', headers, body: JSON.stringify({ action: 'publish' }) })).ok);
              const fileId = crypto.randomUUID(), form = new FormData();
              form.append('payload', JSON.stringify({ submissionKey: crypto.randomUUID(), answers: { [id]: { value: [fileId] } } }));
              form.append('file:' + fileId, new File(['persisted attachment contents'], 'ci-attachment.txt', { type: 'text/plain' }));
              assert((await fetch(base + '/api/public/' + survey.shareId, { method: 'POST', headers: { Origin: origin }, body: form })).ok);
            }
            const surveys = await fetch(base + '/api/surveys', { headers });
            assert(surveys.ok, 'Authenticated database query must succeed');
            const survey = (await surveys.json()).items.find(item => item.title === title);
            assert(survey, 'Survey must survive container recreation and backup recovery');
            const results = await (await fetch(base + '/api/surveys/' + survey.id + '/results', { headers })).json();
            assert.equal(results.items.length, 1);
            const attachment = Object.values(results.items[0].answers)[0].files[0];
            const downloaded = await fetch(base + '/api/attachments/' + attachment.id, { headers });
            assert(downloaded.ok, 'Attachment must survive container recreation and backup recovery');
            assert.equal(await downloaded.text(), 'persisted attachment contents');
            console.log('Embedded database login and persisted survey verified');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml up -d --no-build --wait app
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml exec -T -e CHECK_CREATE=1 app node < /tmp/qingwen-image-check.cjs
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml exec -T app psql -U survey -d survey -Atc 'SHOW listen_addresses' | grep -Fx 127.0.0.1
          container_id=$(docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml ps -q app)
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml stop app
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" != 137
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml down
          ADMIN_PASSWORD=ShouldNotOverwrite123 docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml up -d --no-build --wait app
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml exec -T app node < /tmp/qingwen-image-check.cjs
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml stop app
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml run --rm --no-deps -T app backup > /tmp/qingwen-image-backup.tar
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml down -v
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml run --rm --no-deps -T app restore-backup < /tmp/qingwen-image-backup.tar
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml up -d --no-build --wait app
          docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml exec -T app node < /tmp/qingwen-image-check.cjs
      - name: Container diagnostics
        if: failure()
        run: docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml logs --no-color --tail=100
      - name: Clean up image verification database
        if: always()
        run: docker compose -p qingwen-image-ci --env-file /dev/null -f compose.prod.yaml down -v --remove-orphans
      - name: Publish verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          build-args: NEXT_PUBLIC_BASE_PATH=${{ matrix.base_path }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runner-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.variant }}
